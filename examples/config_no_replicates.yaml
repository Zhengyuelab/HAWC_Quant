# Minimal HAWCQuant configuration for 4 groups x 1 sample design.
# In this design, within-group replicate normalization is automatically skipped.
project:
  outdir: results_no_replicates
  threads: 16

samples: examples/samples_no_replicates.tsv

references:
  target_name: LW13
  reference_name: Ecoli
  target_genome: data/ref/LW13/genome.fna
  reference_genome: data/ref/Ecoli/genome.fna
  target_gff: data/ref/LW13/genomic.gff
  reference_gff: data/ref/Ecoli/genomic.gff
  target_protein_faa: data/ref/LW13/protein.faa
  reference_protein_faa: data/ref/Ecoli/protein.faa

fastp:
  enabled: true
  threads: 4
  skip_existing: true
  timeout_sec: 0
  execution_mode: python_watchdog
  max_retries: 3
  stall_check_sec: 30
  stall_timeout_sec: 600
  cpu_threshold: 1.0
  min_runtime_sec: 120
  retry_sleep_sec: 10
  cleanup_on_retry: true
  detect_adapter_for_pe: true
  cut_front: true
  cut_front_mean_quality: 5
  cut_tail: true
  cut_tail_mean_quality: 5
  cut_right: true
  cut_right_window_size: 4
  cut_right_mean_quality: 20
  length_required: 100
  extra: ""

alignment:
  mapper: bowtie2
  score_min: "L,-0.1,-0.1"
  deduplicate: true
  samtools_sort_memory: 2G
  extra_bowtie2: ""

counting:
  tool: featureCounts
  feature_type: CDS
  id_attribute: gene_id
  htseq:
    stranded: "no"
    mode: intersection-strict
    min_aqual: 10
    order: name
  featureCounts:
    stranded: 0
    paired: true
    count_read_pairs: true
    require_both_ends_mapped: true
    check_chimeric_fragments: true
    min_mapq: 10
    extra: ""

orthofinder:
  enabled: true
  search: diamond
  threads: 16
  species_order:
    - Ecoli
    - LW13

normalization:
  target_species: LW13
  reference_species: Ecoli
  unique_min_count: 10
  z_threshold: 3
  fit_intercept: false
  min_fit_genes: 20
  group_column: sample_prefix
  replicate_groups: auto
  replicate_normalization:
    enabled: auto
    skip_single_sample_groups: true
  target_replicate_groups: auto
  reference_replicate_groups: auto_mix
  calibration_edges:
    - name: k1
      species: target
      source_group: 2-1
      target_group: 2-3
    - name: k2
      species: target
      source_group: 2-2
      target_group: 2-4
    - name: k3
      species: reference
      source_group: 2-3
      target_group: 2-4
  calibration_apply:
    - groups: [2-1]
      multiply_by: [k1, k3]
    - groups: [2-2]
      multiply_by: [k2]
    - groups: [2-3]
      multiply_by: [k3]
    - groups: [2-4]
      multiply_by: []

expression:
  length_source: gtf
  tpm_output: true
  cpm_output: true

deseq2:
  enabled: false
  contrasts: examples/contrasts.tsv
  trinity_run_DE_analysis: run_DE_analysis.pl
